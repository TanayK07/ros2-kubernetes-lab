name: kind cluster run (PR 115 scratch)

on:
  push:
    branches: [ci/kind-cluster-run]
  workflow_dispatch:

permissions:
  contents: read

env:
  KIND_VERSION: v0.33.0
  KUBECTL_VERSION: v1.37.1

jobs:
  cluster:
    name: kind 3-node, pulse manifest (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install kind and kubectl (checksums from the upstream release files)
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/bin"; mkdir -p "$bin"; cd "$bin"
          a=${{ matrix.arch }}
          curl -fsSL --retry 3 -o kind "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-$a"
          curl -fsSL --retry 3 -o kind.sha "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-$a.sha256sum"
          echo "$(awk '{print $1}' kind.sha)  kind" | sha256sum --check -
          curl -fsSL --retry 3 -o kubectl "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/$a/kubectl"
          echo "$(curl -fsSL --retry 3 "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/$a/kubectl.sha256")  kubectl" | sha256sum --check -
          chmod +x kind kubectl
          echo "$bin" >> "$GITHUB_PATH"
      - name: Build the Jazzy image from the PR's ROS2/Dockerfile
        run: docker build --pull --file ROS2/Dockerfile --tag ros-jazzy-lab:local .
      - name: Create 3-node kind cluster (#97 profile)
        run: kind create cluster --config .github/ci-kind/kind-3node.yaml --wait 180s
      - name: Load image into all nodes
        run: kind load docker-image ros-jazzy-lab:local --name ros2k8s-demo
      - name: Apply manifest, scrape via port-forward, dump state
        env:
          OUT: ${{ runner.temp }}/out
        run: bash .github/ci-kind/run.sh
      - name: Step summary
        if: always()
        run: |
          {
            echo '```'
            cat "$RUNNER_TEMP/out/versions.txt" 2>/dev/null
            cat "$RUNNER_TEMP/out/summary.txt" 2>/dev/null
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Cluster state on failure
        if: failure()
        run: |
          kubectl --context kind-ros2k8s-demo get nodes -o wide || true
          kubectl --context kind-ros2k8s-demo -n ros2-pulse-pilot get pods -o wide || true
          kubectl --context kind-ros2k8s-demo -n ros2-pulse-pilot describe pods || true
          kubectl --context kind-ros2k8s-demo -n ros2-pulse-pilot get events --sort-by=.lastTimestamp || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cluster-run-${{ matrix.arch }}
          path: ${{ runner.temp }}/out
          if-no-files-found: ignore
